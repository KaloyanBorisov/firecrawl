# SearXNG configuration for the self-hosted Firecrawl search backend.
# Only the differences from the SearXNG defaults are listed here.
# The secret key comes from the SEARXNG_SECRET environment variable
# (see docker-compose.yaml); do not commit a real secret to this file.
use_default_settings: true

general:
  instance_name: "firecrawl-searxng"

server:
  # Firecrawl is the only client and sends bursts of requests from one IP;
  # the built-in limiter would throttle it.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  # Firecrawl calls /search?format=json; without "json" SearXNG answers 403.
  formats:
    - html
    - json
  # Keep blocked engines suspended longer so they are not retried every few
  # minutes (each retry keeps the IP flagged). Defaults: 3600 for 429.
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 10800
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

outgoing:
  # The response waits for the slowest engine; a hung engine used to hold every
  # search for 6s. Blocked engines answer (or are suspended) much faster.
  request_timeout: 4.0
  max_request_timeout: 8.0

# Make sure the engines listed in SEARXNG_ENGINES are enabled, so that one
# provider blocking us (e.g. DuckDuckGo's anti-bot page) does not empty
# the result set.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  # Startpage stays off: Anubis Proof-of-Work CAPTCHA ("difficulty too high").
  - name: startpage
    inactive: true
  - name: duckduckgo
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  # Extra providers so results survive google/duckduckgo/qwant blocks.
  # Both are disabled in SearXNG defaults.
  - name: mojeek
    inactive: false
    disabled: false
  - name: yahoo
    disabled: false
  # Hosted Firecrawl search (api.firecrawl.dev), keyless unless
  # FIRECRAWL_HOSTED_KEY is set. Module: searxng/engines/firecrawl_hosted.py,
  # mounted by docker-compose.yaml. Opt in by adding "firecrawl" to
  # SEARXNG_ENGINES in .env. Queries leave the machine.
  - name: firecrawl
    engine: firecrawl_hosted
    shortcut: fc
    timeout: 8.0
    disabled: false
  # Tor-only engines: they cannot load without a Tor proxy and log an
  # error on every start. "inactive" skips loading them ("disabled" only
  # hides them from searches).
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
