# Builds the self-hosted Firecrawl images from this fork and pushes them to GHCR,
# so Dockhand can pull them instead of building locally.
name: Build self-host images

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/playwright-service-ts/**
      - apps/nuq-postgres/**
      - .github/workflows/build-selfhost-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-images
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      playwright: ${{ steps.filter.outputs.playwright }}
      nuq: ${{ steps.filter.outputs.nuq }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/build-selfhost-images.yml'
            playwright:
              - 'apps/playwright-service-ts/**'
              - '.github/workflows/build-selfhost-images.yml'
            nuq:
              - 'apps/nuq-postgres/**'
              - '.github/workflows/build-selfhost-images.yml'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: api,        name: firecrawl-api,                context: apps/api }
          - { key: playwright, name: firecrawl-playwright-service, context: apps/playwright-service-ts }
          - { key: nuq,        name: firecrawl-nuq-postgres,       context: apps/nuq-postgres }
    steps:
      - name: Decide whether to build
        id: go
        run: echo "run=${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.go.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.go.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.go.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/kaloyanborisov/${{ matrix.name }}:latest
            ghcr.io/kaloyanborisov/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}