# Daily sync of this private fork with upstream firecrawl/firecrawl main,
# in review mode: main is never written to directly.
#
# When upstream has commits that main lacks, they are pushed to the
# sync/upstream-main branch and a PR into main is opened (or its description
# refreshed). The PR lists the new commits and says whether they merge cleanly
# or which files conflict. Merging the PR is the review step; that push to
# main then triggers build-selfhost-images.yml as usual.
#
# Work already on the sync branch (e.g. a conflict resolution) is kept: new
# upstream commits are merged into it instead of force-pushed over it.
#
# Pushing upstream commits that change .github/workflows/** needs a token with
# the "workflow" permission; the built-in GITHUB_TOKEN never has it. SYNC_TOKEN
# is a fine-grained PAT for this repo with Contents, Pull requests and
# Workflows: read and write.
name: Sync upstream

on:
  schedule:
    - cron: "17 13 * * *" # daily, 05:17 PST / 06:17 PDT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: firecrawl/firecrawl
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Count new upstream commits
        id: check
        run: |
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in ${TARGET_BRANCH}: ${behind}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check whether the merge is clean
        id: trial
        if: steps.check.outputs.behind != '0'
        run: |
          if git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" >/dev/null 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          fi
          git merge --abort 2>/dev/null || git reset -q --hard HEAD

      - name: Update sync branch
        id: branch
        if: steps.check.outputs.behind != '0'
        run: |
          before=""
          extra=0
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null; then
            git fetch --no-tags origin "${SYNC_BRANCH}"
            before=$(git rev-parse "origin/${SYNC_BRANCH}")
            extra=$(git rev-list --count "upstream/${UPSTREAM_BRANCH}..origin/${SYNC_BRANCH}")
          fi
          if [ "${extra}" != "0" ]; then
            echo "${SYNC_BRANCH} has ${extra} commit(s) beyond upstream; merging upstream into it." >> "$GITHUB_STEP_SUMMARY"
            git checkout -q -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
            if ! git merge --no-edit -m "Merge upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} into ${SYNC_BRANCH}" "upstream/${UPSTREAM_BRANCH}"; then
              git merge --abort
              echo "::error::New upstream commits conflict with the work on ${SYNC_BRANCH}; update that branch by hand."
              exit 1
            fi
            push_args=(origin "HEAD:refs/heads/${SYNC_BRANCH}")
          else
            push_args=(--force origin "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${SYNC_BRANCH}")
          fi
          if ! git push "${push_args[@]}"; then
            echo "::error::Could not push ${SYNC_BRANCH}. If upstream changed .github/workflows, SYNC_TOKEN needs Workflows: read and write."
            exit 1
          fi
          git fetch --no-tags origin "${SYNC_BRANCH}"
          after=$(git rev-parse "origin/${SYNC_BRANCH}")
          if [ "${before}" = "${after}" ]; then echo "moved=false" >> "$GITHUB_OUTPUT"; else echo "moved=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open or refresh the review PR
        if: steps.check.outputs.behind != '0'
        env:
          # Every gh call passes -R: with an "upstream" remote present, gh would
          # otherwise target firecrawl/firecrawl instead of this fork.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          BEHIND: ${{ steps.check.outputs.behind }}
          CLEAN: ${{ steps.trial.outputs.clean }}
          MOVED: ${{ steps.branch.outputs.moved }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")
          {
            echo "Daily sync of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` (${upstream_sha}) into \`${TARGET_BRANCH}\`: **${BEHIND} new upstream commits**. Review, then merge this PR to take them."
            echo
            if [ "${CLEAN}" = "true" ]; then
              echo "✅ Merges cleanly into \`${TARGET_BRANCH}\`."
            else
              echo "⚠️ Conflicts with this fork's own commits in:"
              sed 's/^/- `/; s/$/`/' /tmp/conflicts.txt
              echo
              echo "Resolve them on \`${SYNC_BRANCH}\` (merge \`${TARGET_BRANCH}\` into it) or directly on \`${TARGET_BRANCH}\`; later syncs keep that work."
            fi
            echo
            echo "### New upstream commits"
            git log --no-merges --format='- `%h` %s' "HEAD..upstream/${UPSTREAM_BRANCH}" | head -100
            n=$(git rev-list --no-merges --count "HEAD..upstream/${UPSTREAM_BRANCH}")
            if [ "${n}" -gt 100 ]; then echo "- … and $((n - 100)) more"; fi
            echo
            echo "_Updated by the Sync upstream workflow ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))._"
          } > /tmp/body.md
          title="Sync upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} (${BEHIND} commits)"
          existing=$(gh pr list -R "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh pr edit -R "${GITHUB_REPOSITORY}" "${existing}" --title "${title}" --body-file /tmp/body.md
            if [ "${MOVED}" = "true" ]; then
              gh pr comment -R "${GITHUB_REPOSITORY}" "${existing}" --body "New upstream commits added (now ${upstream_sha}, ${BEHIND} behind)."
            fi
            echo "Refreshed PR #${existing}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create -R "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" \
              --title "${title}" --body-file /tmp/body.md
            echo "Opened a review PR." >> "$GITHUB_STEP_SUMMARY"
          fi